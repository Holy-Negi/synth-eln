[project]
name = "synth-eln"
version = "0.2.0"
description = "synth-ELN"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.3",
    "psycopg2-binary>=2.9.12",
    "pubchempy>=1.0.5",
    "python-dotenv>=1.2.2",
    "rdkit>=2026.3.3",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
stubPath = "typings"
